[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --import-mode=importlib
markers =
    core: canonical tests that must pass for the supported CausalGate pipeline
    integration: tests that exercise multiple subsystems together
    slow: slower stress or end-to-end tests, excluded from the canonical core by default
    legacy: archived historical tests, not collected from tests/
    experimental: tests for prototypes or research variants, not part of the core gate
    causal_synthetic: Pearl-style synthetic causal pipeline fixtures
